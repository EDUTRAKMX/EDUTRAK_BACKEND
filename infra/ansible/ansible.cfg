[defaults]
inventory = inventario/hosts.yml
roles_path = roles
interpreter_python = /usr/bin/python3
host_key_checking = True
forks = 5
timeout = 30
retry_files_enabled = False
# Si una máquina falla, se detiene todo: nunca se bloquea la cuenta temporal
# (cierre) con una parte de la infraestructura a medio configurar.
any_errors_fatal = True
callback_result_format = yaml
# Los secretos nunca deben aparecer en la salida aunque una tarea falle.
display_args_to_stdout = False

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
# El subsistema sftp está deshabilitado en sshd (no se usa): se copia por "dd".
transfer_method = piped
usetty = False
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15
control_path_dir = ~/.ansible/cp
